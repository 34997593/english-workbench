name: Daily English News

on:
  schedule:
    - cron: "0 23 * * *"          # 北京时间每天 07:00 自动抓新闻
  workflow_dispatch: {}            # 允许在 Actions 页面手动点 Run
  push:
    branches: [main]               # 每次推送 main 也重新部署 Pages

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch latest English news
        run: python fetch-news.py
      - name: Commit news.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "news.json 无变化，跳过提交"
          else
            git commit -m "auto: update news.json $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
